# =============================================================
#  Ye file yahan rakhni hai:  .github/workflows/snake.yml
#  (Pateldhruv64/Pateldhruv64 repo me — wahi jisme profile README hai)
#
#  Setup:
#   1. File commit karo
#   2. Repo → Settings → Actions → General → Workflow permissions
#      → "Read and write permissions" select karke Save karo   <-- ZARURI
#   3. Actions tab → "Generate Snake Animation" → Run workflow
#   4. Ek baar chalne ke baad `output` branch ban jaayegi
#   5. Tab README me snake wala commented block uncomment kar dena
# =============================================================

name: Generate Snake Animation

on:
  schedule:
    # Roz 00:00 UTC pe auto-update
    - cron: "0 0 * * *"
  workflow_dispatch: # Manually bhi chala sakte ho
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
